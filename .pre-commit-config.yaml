repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: local-llm-golden-gate
        name: Local LLM Golden Eval Gate (on prompt changes)
        entry: bash -c 'cd backend && PYTHONPATH=. uv run python scripts/run_local_llm_gate.py --staged --allow-offline'
        language: system
        pass_filenames: false
        stages: [manual]
