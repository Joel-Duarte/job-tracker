<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Tracker Clipper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 14px; font-weight: 600; color: #60a5fa; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status-box {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status-success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
    .status-error { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>Job Tracker Clipper</h1>
    <span id="tab-indicator" style="font-size: 11px; color: var(--muted);">Ready</span>
  </header>

  <div class="form-group">
    <label>Company</label>
    <input type="text" id="company" placeholder="e.g. Stripe">
  </div>

  <div class="form-group">
    <label>Position / Role</label>
    <input type="text" id="position" placeholder="e.g. Senior Backend Engineer">
  </div>

  <div class="form-group">
    <label>Status</label>
    <select id="status">
      <option value="APPLIED">Applied</option>
      <option value="INTERVIEW">Interview</option>
      <option value="BOOKMARKED">Bookmarked</option>
      <option value="OFFER">Offer</option>
    </select>
  </div>

  <div class="form-group">
    <label>Backend API URL</label>
    <input type="text" id="api-url" value="http://localhost:8000">
  </div>

  <button id="clip-btn">Clip to Job Tracker</button>
  <div id="status-box"></div>

  <script src="popup.js"></script>
</body>
</html>
