name: job-tracker

services:
  # ============================================================================
  # Database: PostgreSQL 16 + pgvector & pg_trgm (Permanent Data Storage)
  # ============================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: job-tracker-postgresdb
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - job-tracker-net

  # ============================================================================
  # Stealth Scraper: Camofox Browser Automation Server
  # ============================================================================
  scraper:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: job-tracker-scraper
    restart: unless-stopped
    environment:
      PROXY_HOST: scraper-egress
      PROXY_PORT: 3128
      CAMOFOX_DISABLE_DEFAULT_ADDONS: "1"
    depends_on:
      - scraper-egress
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9377/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scraper-isolated-net

  scraper-egress:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "/app/scraper_egress_proxy.py"]
    volumes:
      - ./scripts/scraper_egress_proxy.py:/app/scraper_egress_proxy.py:ro
    networks:
      - scraper-isolated-net
      - job-tracker-net

  scraper-api:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - scraper
    volumes:
      - ./scripts/scraper_api.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scraper-isolated-net
      - job-tracker-net

  # ============================================================================
  # Backend API & Workers: FastAPI + LangGraph Orchestrator
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-tracker-backend
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8008}:8000"
    depends_on:
      db:
        condition: service_healthy
      scraper-api:
        condition: service_started
    environment:
      ENVIRONMENT: "production"
      SEED_DEV_DATA: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-}
      CAMOUFOX_ENDPOINT: http://scraper-api:9377
      SCRAPER_EGRESS_PROXY: http://scraper-egress:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - job-tracker-net

  # ============================================================================
  # Frontend UI: Vue.js 3 + Vite SPA served via Nginx Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-tracker-frontend
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-4173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - job-tracker-net

# ==============================================================================
# Persistent Named Volumes & Isolated Network
# ==============================================================================
volumes:
  postgres_data:
    name: job_tracker_postgres_data

networks:
  job-tracker-net:
    name: job_tracker_network
    driver: bridge
  scraper-isolated-net:
    driver: bridge
    internal: true
