name: job-tracker

services:
  # ============================================================================
  # Database: PostgreSQL 16 + pgvector & pg_trgm (Permanent Data Storage)
  # ============================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: job-tracker-postgresdb
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - job-tracker-net

  # ============================================================================
  # Stealth Scraper: Camofox Browser Automation Server
  # ============================================================================
  scraper:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: job-tracker-scraper
    restart: unless-stopped
    ports:
      - "${CAMOUFOX_PORT:-9377}:9377"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9377/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - job-tracker-net

  # ============================================================================
  # Backend API & Workers: FastAPI + LangGraph Orchestrator
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-tracker-backend
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${BACKEND_PORT:-8008}:8000"
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      CAMOUFOX_ENDPOINT: http://scraper:9377
      LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-openai}
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-lm-1234}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen/qwen3.5-9b}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://host.docker.internal:1234/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-nomic-embed-text-v2-moe}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - job-tracker-net

  # ============================================================================
  # Frontend UI: Vue.js 3 + Vite SPA served via Nginx Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-tracker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - job-tracker-net

# ==============================================================================
# Persistent Named Volumes & Isolated Network
# ==============================================================================
volumes:
  postgres_data:
    name: job_tracker_postgres_data
  app_data:
    name: job_tracker_app_data

networks:
  job-tracker-net:
    name: job_tracker_network
    driver: bridge
