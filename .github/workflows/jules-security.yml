name: Jules security fix

on:
  workflow_dispatch:
    inputs:
      alert_type:
        description: Security alert source
        required: true
        type: choice
        options: [codeql, dependabot]
      alert_number:
        description: Alert number from the repository Security tab
        required: true
        type: number

permissions:
  contents: read
  security-events: read
  vulnerability-alerts: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Start a private Jules session
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_TYPE: ${{ inputs.alert_type }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
        run: python scripts/jules_security.py
