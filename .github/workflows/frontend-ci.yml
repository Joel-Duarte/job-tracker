name: Frontend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      # Using npm install because package-lock.json might not exist or might be out of sync
      run: npm install
      
    - name: Check code formatting and linting
      run: npm run lint --if-present

    - name: Run unit tests
      run: npm run test:unit --if-present
    
    - name: Run Build
      run: npm run build
