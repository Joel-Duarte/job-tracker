name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "backend/pyproject.toml"

    - name: Install dependencies
      run: uv sync

    - name: Check formatting with Ruff
      run: uv run ruff format --check .

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Run tests with pytest
      # Note: Pytest requires postgres/testcontainers, which requires Docker.
      # The ubuntu-latest runner comes with Docker pre-installed.
      run: uv run pytest
