name: Jules UI QA review or fix

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Optional open same-repository UI PR number; leave blank to fix failures on the default branch
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Start a Jules UI review or fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: python scripts/jules_ui_qa.py
