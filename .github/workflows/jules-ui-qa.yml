name: Jules UI QA review or fix

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Optional open same-repository UI PR number; leave blank to fix failures on the default branch
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Start a Jules UI review or fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: python scripts/jules_ui_qa.py
